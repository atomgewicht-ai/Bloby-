<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6ec3f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Froschvolley</title>
<style>
  :root { --ink:#17324a; --panel:rgba(255,255,255,.94); --accent:#2f9e57; --accent2:#e2703a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#10212f; color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; }
  body { display:flex; align-items:center; justify-content:center; position:fixed; inset:0; }
  #stage { position:relative; touch-action:none; }
  canvas { width:100%; height:100%; display:block; }
  #probe { position:fixed; top:0; left:0; width:0; height:env(safe-area-inset-top, 0px); visibility:hidden; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(16,33,47,.45); padding:16px; }
  .overlay[hidden] { display:none; }
  .card { background:var(--panel); border-radius:20px; padding:22px 18px; width:100%; max-width:380px;
    text-align:center; max-height:100%; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  h1 { margin:0 0 .3em; font-size:36px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  p { margin:.5em 0; font-size:15px; line-height:1.4; }
  .row { display:flex; gap:8px; justify-content:center; margin:14px 0; }
  .col { display:flex; flex-direction:column; gap:10px; margin:14px 0; }
  button { font:inherit; font-weight:700; font-size:18px; border:0; border-radius:14px; min-height:52px;
    padding:.6em 1em; cursor:pointer; background:var(--accent); color:#fff; touch-action:manipulation; }
  .row button { flex:1; font-size:15px; min-height:44px; padding:.4em .2em; }
  button.alt { background:var(--accent2); }
  button.ghost { background:#dfe7ee; color:var(--ink); }
  button.sel { background:var(--ink); color:#fff; }
  button:active { filter:brightness(.9); }
  .how { text-align:left; background:#eef3f7; border-radius:14px; padding:10px 14px; font-size:14px; line-height:1.5; }
  .how b { color:var(--accent); }
  .desk { font-size:12px; opacity:.7; }
  @media (pointer:coarse) { .desk { display:none; } }
  #corner { position:absolute; top:calc(env(safe-area-inset-top, 0px) + 10px); left:50%;
    transform:translateX(-50%); display:flex; gap:8px; }
  #corner button { min-height:0; width:40px; height:40px; padding:0; border-radius:50%;
    background:rgba(255,255,255,.55); color:var(--ink); font-size:16px; }
</style>
</head>
<body>
<div id="probe"></div>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="corner">
    <button id="btnPause" aria-label="Pause">II</button>
    <button id="btnSound" aria-label="Ton">♪</button>
  </div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>Frosch<span>volley</span></h1>
      <p>Bring den Ball übers Netz. Höchstens 3 Berührungen pro Seite, gespielt wird bis <b>15</b> (mit 2 Vorsprung).</p>
      <div class="how">
        <b>Finger ziehen</b> – dein Frosch läuft zum Finger<br>
        <b>Nach oben wischen</b> – springen<br>
        <b>Zweiter Finger tippt</b> – auch springen
      </div>
      <div class="row" id="diff">
        <button class="ghost" data-d="0">Leicht</button>
        <button class="ghost sel" data-d="1">Mittel</button>
        <button class="ghost" data-d="2">Schwer</button>
      </div>
      <div class="col">
        <button id="btn1p">1 Spieler</button>
        <button id="btn2p" class="alt">2 Spieler · ein Handy</button>
        <button id="btnDemo" class="ghost">Demo ansehen</button>
      </div>
      <p class="desk">Tastatur: A/D/W (grün) · ←/→/↑ (orange) · P Pause · M Ton</p>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="card">
      <h1>Pause</h1>
      <div class="col">
        <button id="btnResume">Weiter</button>
        <button id="btnQuit" class="ghost">Menü</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <h1 id="overTitle"></h1>
      <p id="overScore" style="font-size:28px;font-weight:800"></p>
      <div class="col">
        <button id="btnAgain">Nochmal</button>
        <button id="btnMenu" class="ghost">Menü</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- Konstanten (logische Einheiten: px, px/s) ----------
// Hochformat: feste Breite, die Höhe richtet sich nach dem Bildschirm.
const W = 450, NETX = W / 2, NETHW = 5, NET_H = 125, PAD = 150;   // PAD = Daumenzone unter dem Feld
let H = 800, GROUND = H - PAD, NETTOP = GROUND - NET_H, safeTop = 0;
const PR = 30, BR = 21;                 // Radius Frosch / Ball
const P_SPEED = 320, P_JUMP = 770, P_GRAV = 2200;
const B_GRAV = 800, B_HIT = 500, B_MAX = 850;
const WIN_SCORE = 15, MAX_TOUCHES = 3;
const STEP = 1 / 120;

const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- Zustand ----------
const mkPlayer = (side, color, belly, name) => ({
  side, color, belly, name,
  homeX: NETX + side * 112, x: NETX + side * 112, y: GROUND - PR, vx: 0, vy: 0,
  score: 0, touches: 0, cool: 0, ai: false,
  aiErr: 0, aiJump: false, aiSpeed: 1,
  in: { left: false, right: false, jump: false },
  targetX: null, jumpBuf: 0,           // Touch-Steuerung
});
const P1 = mkPlayer(-1, '#3fae5f', '#c9efb0', 'Grün');
const P2 = mkPlayer(1, '#e2793f', '#ffe0b8', 'Orange');
const players = [P1, P2];
const ball = { x: 0, y: 0, px: 0, vx: 0, vy: 0, rot: 0 };

let state = 'menu';          // menu | serve | play | point | over
let paused = false, timer = 0, server = P1, message = '', msgT = 0;
let difficulty = 1, mode = '1p', soundOn = true, showHint = true;
let particles = [];
const DIFF = [
  { speed: .7,  err: 20, jump: .15 },
  { speed: .88, err: 9,  jump: .4 },
  { speed: 1,   err: 3,  jump: .65 },
];

// ---------- Ton & Vibration ----------
let actx = null;
function beep(freq, dur, type = 'sine', vol = .15, slide = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* kein Ton verfügbar */ }
}
const buzz = ms => { try { if (soundOn && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
const sfx = {
  hit: () => beep(300 + Math.random() * 120, .09, 'triangle', .2, 200),
  net: () => beep(140, .08, 'square', .06),
  point: () => { beep(880, .12, 'square', .08); setTimeout(() => beep(660, .25, 'square', .08), 130); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .22, 'triangle', .18), i * 140)),
};

// ---------- Spielablauf ----------
function startGame(m) {
  mode = m;
  P1.ai = m === 'demo'; P2.ai = m !== '2p';
  players.forEach(p => { p.score = 0; });
  server = P1; particles = []; showHint = m !== 'demo';
  $('menu').hidden = true; $('over').hidden = true; $('pause').hidden = true;
  paused = false;
  newRally();
}
function newRally() {
  players.forEach(p => {
    p.x = p.homeX; p.y = GROUND - PR; p.vx = p.vy = 0; p.touches = 0; p.cool = 0; p.jumpBuf = 0; rollAI(p);
  });
  ball.x = ball.px = server.homeX; ball.y = GROUND - 170; ball.vx = ball.vy = 0;
  state = 'serve';
}
function toMenu() {
  state = 'menu'; paused = false;
  $('menu').hidden = false; $('over').hidden = true; $('pause').hidden = true;
}
function setPaused(v) {
  if (state === 'menu' || state === 'over') return;
  paused = v; $('pause').hidden = !v;
  if (v) releaseAll();
}
function award(winner, text) {
  if (state !== 'play' && state !== 'serve') return;
  winner.score++; server = winner; state = 'point'; timer = 1.4;
  message = text; msgT = 1.4; sfx.point(); buzz(30);
}
function afterPoint() {
  const lead = Math.abs(P1.score - P2.score), top = Math.max(P1.score, P2.score);
  if (top >= WIN_SCORE && lead >= 2) {
    state = 'over';
    const w = P1.score > P2.score ? P1 : P2;
    $('overTitle').textContent = `${w.name} gewinnt!`;
    $('overTitle').style.color = w.color;
    $('overScore').textContent = `${P1.score} : ${P2.score}`;
    $('over').hidden = false; sfx.win(); releaseAll();
  } else newRally();
}
function rollAI(p) {
  const d = DIFF[difficulty];
  p.aiErr = (Math.random() * 2 - 1) * d.err;
  p.aiJump = Math.random() < d.jump;
}
function onTouch(p) {
  sfx.hit(); if (!p.ai) buzz(8);
  for (let i = 0; i < 6; i++) particles.push({
    x: ball.x, y: ball.y, vx: (Math.random() - .5) * 240, vy: (Math.random() - .7) * 240, t: .35, c: '#fff' });
  if (state === 'serve') { state = 'play'; showHint = false; }
  if (state !== 'play') return;
  const other = p === P1 ? P2 : P1;
  other.touches = 0; p.touches++;
  players.forEach(rollAI);
  if (p.touches > MAX_TOUCHES) award(other, 'Zu oft berührt!');
}

// ---------- KI ----------
function predict(targetY) {
  let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  const dt = 1 / 60;
  for (let i = 0; i < 400; i++) {
    if (y >= targetY && vy > 0) break;
    vy += B_GRAV * dt;
    const nx = x + vx * dt; y += vy * dt;
    if (y > NETTOP && (x - NETX) * (nx - NETX) <= 0 && x !== nx) vx = -vx * .8;
    else x = nx;
    if (x < BR) { x = BR; vx = -vx; }
    if (x > W - BR) { x = W - BR; vx = -vx; }
  }
  return x;
}
function think(p) {
  const s = p.side, inp = p.in, contact = PR + BR;
  let target = p.homeX, jump = false;
  if (state === 'serve') {
    if (server === p) {
      target = ball.x + s * 18;
      jump = Math.abs(p.x - target) < 7;
    }
  } else if (state === 'play') {
    const land = predict(GROUND - 2 * PR - BR + 8);
    const mine = (land - NETX) * s > 0 || ((ball.x - NETX) * s > 0 && ball.y > NETTOP);
    if (mine) {
      // Abschlagwinkel so wählen, dass der Ball übers Netz kommt
      const need = Math.min(Math.abs(land - NETX) + 95, 300);
      const theta = .5 * Math.asin(Math.min(1, need * B_GRAV / (B_HIT * B_HIT)));
      const off = contact * Math.sin(Math.max(theta, .12));
      target = land + s * off + p.aiErr;
      const dx = Math.abs(ball.x + s * off - p.x), dy = p.y - ball.y;
      if (p.aiJump && ball.vy > 0 && dx < 26 && dy > 95 && dy < 165) jump = true;
      if (ball.vy > 0 && dy < 105 && dx > 45 && dx < 105) jump = true;   // Notfall
    }
  }
  const diff = target - p.x;
  inp.left = diff < -4; inp.right = diff > 4; inp.jump = jump;
  p.aiSpeed = DIFF[difficulty].speed;
}

// ---------- Physik ----------
function stepPlayer(p, dt) {
  if (p.ai) think(p);
  const inp = p.in;
  if (!p.ai && p.targetX !== null) {
    const diff = p.targetX - p.x;                      // dem Finger hinterherlaufen
    p.vx = Math.max(-P_SPEED, Math.min(P_SPEED, diff / dt));
  } else {
    p.vx = ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * P_SPEED * (p.ai ? p.aiSpeed : 1);
  }
  const onGround = p.y >= GROUND - PR - .01;
  if ((inp.jump || p.jumpBuf > 0) && onGround) { p.vy = -P_JUMP; p.jumpBuf = 0; }
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  p.vy += P_GRAV * dt;
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (p.y > GROUND - PR) { p.y = GROUND - PR; p.vy = 0; }
  const lo = p.side < 0 ? PR : NETX + NETHW + PR, hi = p.side < 0 ? NETX - NETHW - PR : W - PR;
  if (p.x < lo) p.x = lo; if (p.x > hi) p.x = hi;
  p.cool -= dt;
}
function stepBall(dt) {
  const b = ball;
  b.px = b.x;
  if (state !== 'serve') {
    b.vy += B_GRAV * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.rot += b.vx * dt / BR;
  }
  if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); }
  if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); }
  // Netz
  const reach = BR + NETHW;
  if (b.y > NETTOP) {
    if (Math.abs(b.x - NETX) < reach) {
      const side = b.px < NETX ? -1 : 1;
      b.x = NETX + side * reach;
      if (b.vx * side < 0) { b.vx = -b.vx * .8; sfx.net(); }
    }
  } else {
    const dx = b.x - NETX, dy = b.y - NETTOP, d = Math.hypot(dx, dy);
    if (d < reach && d > 0) {
      const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
      b.x = NETX + nx * reach; b.y = NETTOP + ny * reach;
      if (vn < 0) { b.vx -= 1.8 * vn * nx; b.vy -= 1.8 * vn * ny; sfx.net(); }
    }
  }
  // Frösche
  for (const p of players) {
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy), R = PR + BR;
    if (d < R) {
      const nx = d > 0 ? dx / d : 0, ny = d > 0 ? dy / d : -1;
      b.x = p.x + nx * R; b.y = p.y + ny * R;
      b.vx = nx * B_HIT + p.vx * .4; b.vy = ny * B_HIT + p.vy * .25;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > B_MAX) { b.vx *= B_MAX / sp; b.vy *= B_MAX / sp; }
      if (p.cool <= 0) { p.cool = .18; onTouch(p); }
    }
  }
  // Boden
  if (b.y > GROUND - BR) {
    b.y = GROUND - BR;
    if (state === 'play') {
      for (let i = 0; i < 12; i++) particles.push({
        x: b.x, y: GROUND, vx: (Math.random() - .5) * 300, vy: -Math.random() * 240, t: .5, c: '#fff6d8' });
      award(b.x < NETX ? P2 : P1, 'Punkt!');
    }
    b.vy = -Math.abs(b.vy) * .55; b.vx *= .8;
    if (Math.abs(b.vy) < 60) b.vy = 0;
  }
}
function step(dt) {
  players.forEach(p => stepPlayer(p, dt));
  stepBall(dt);
  for (const q of particles) { q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.t -= dt; }
  particles = particles.filter(q => q.t > 0);
  if (msgT > 0) msgT -= dt;
  if (state === 'point') { timer -= dt; if (timer <= 0) afterPoint(); }
}

// ---------- Zeichnen ----------
const clouds = [[60, .16, 1], [300, .09, .7], [200, .30, 1.1], [380, .42, .8]];
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#58b4ee'); g.addColorStop(1, '#dff3ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(W - 80, GROUND * .2, 34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const [cx, fy, s] of clouds) {
    const x = ((cx + t * 5 * s) % (W + 160)) - 80, cy = GROUND * fy;
    for (const [ox, oy, rx, ry] of [[0, 0, 42, 14], [24, -11, 25, 14], [-22, -7, 20, 12]]) {
      ctx.beginPath(); ctx.ellipse(x + ox * s, cy + oy * s, rx * s, ry * s, 0, 0, 7); ctx.fill();
    }
  }
  // Hügel
  ctx.fillStyle = '#9ad48a';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  ctx.quadraticCurveTo(100, GROUND - 130, 215, GROUND - 35); ctx.quadraticCurveTo(340, GROUND - 110, W, GROUND - 55);
  ctx.lineTo(W, GROUND); ctx.fill();
  // Schilf
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const x = 18 + i * 58 + (i % 3) * 8, h = 38 + (i * 37 % 30), sway = Math.sin(t * 1.3 + i) * 4;
    ctx.strokeStyle = '#5c9a55';
    ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.quadraticCurveTo(x, GROUND - h / 2, x + sway, GROUND - h); ctx.stroke();
    ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.ellipse(x + sway, GROUND - h, 3.5, 9, 0, 0, 7); ctx.fill();
  }
  // Sand + Daumenzone
  ctx.fillStyle = '#e9d59a'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#d9c382'; ctx.fillRect(0, GROUND, W, 5);
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(8, GROUND + 20, W - 16, 3);
}
function drawNet() {
  ctx.fillStyle = '#7a5230';
  ctx.beginPath(); ctx.roundRect(NETX - NETHW, NETTOP - NETHW, NETHW * 2, GROUND - NETTOP + NETHW, NETHW); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(NETX - 2, NETTOP, 2, GROUND - NETTOP);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(NETX, NETTOP, NETHW + 1.5, 0, 7); ctx.fill();
}
function drawFrog(p, t) {
  const k = PR / 34;
  const stretch = Math.max(-.14, Math.min(.16, -p.vy / 4500));
  const sy = 1 + stretch, sx = 1 / sy;
  const hgt = (GROUND - PR - p.y) / 200;
  ctx.fillStyle = `rgba(0,0,0,${.2 - Math.min(.12, hgt * .1)})`;
  ctx.beginPath(); ctx.ellipse(p.x, GROUND + 4, PR * (1 - Math.min(.4, hgt * .3)), 6, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(p.x, p.y + PR); ctx.scale(sx * k, sy * k); ctx.translate(0, -34);
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.ellipse(-20, 31, 13, 6, 0, 0, 7); ctx.ellipse(20, 31, 13, 6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 2, 36, 32, 0, 0, 7); ctx.fill();
  ctx.fillStyle = p.belly; ctx.beginPath(); ctx.ellipse(0, 14, 24, 18, 0, 0, 7); ctx.fill();
  const ang = Math.atan2(ball.y - (p.y - 26), ball.x - p.x);
  const blink = (t * 1.1 + p.side) % 3.7 < .12;
  for (const ex of [-15, 15]) {
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(ex, -24, 13, 0, 7); ctx.fill();
    if (blink) {
      ctx.strokeStyle = '#17324a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(ex - 7, -24); ctx.lineTo(ex + 7, -24); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, -25, 9.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#17324a'; ctx.beginPath();
      ctx.arc(ex + Math.cos(ang) * 4, -25 + Math.sin(ang) * 4, 4.6, 0, 7); ctx.fill();
    }
  }
  ctx.strokeStyle = '#17324a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -6, 17, .25 * Math.PI, .75 * Math.PI); ctx.stroke();
  ctx.restore();
}
function drawBall() {
  const b = ball;
  if (b.y < -BR) {                       // Ball über dem Bildrand
    ctx.fillStyle = '#e2443a';
    ctx.beginPath(); ctx.moveTo(b.x, safeTop + 6); ctx.lineTo(b.x - 9, safeTop + 22); ctx.lineTo(b.x + 9, safeTop + 22); ctx.fill();
    return;
  }
  const hgt = Math.max(0, (GROUND - BR - b.y) / 300);
  ctx.fillStyle = `rgba(0,0,0,${Math.max(.05, .2 - hgt * .12)})`;
  ctx.beginPath(); ctx.ellipse(b.x, GROUND + 4, BR * Math.max(.4, 1 - hgt * .4), 5, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  const cols = ['#ffd23f', '#fff', '#3fa7e2', '#fff', '#e2443a', '#fff'];
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, BR, i * Math.PI / 3, (i + 1) * Math.PI / 3); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, 7); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(23,50,74,.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(b.x - 7, b.y - 8, 6, 3.5, -.6, 0, 7); ctx.fill();
}
function drawTouchMarks() {
  // Zeigt, wohin der Frosch läuft – direkt unter dem Finger auf dem Sand.
  for (const p of players) {
    if (p.ai || p.targetX === null) continue;
    const lo = p.side < 0 ? PR : NETX + NETHW + PR, hi = p.side < 0 ? NETX - NETHW - PR : W - PR;
    const x = Math.max(lo, Math.min(hi, p.targetX));
    ctx.fillStyle = p.color; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(x, GROUND + 10); ctx.lineTo(x - 9, GROUND + 24); ctx.lineTo(x + 9, GROUND + 24); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawHUD() {
  const top = safeTop + 18;
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  ctx.font = '800 50px system-ui, sans-serif';
  for (const p of players) {
    const x = NETX + p.side * 150;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(p.score, x, top); ctx.fillStyle = p.color; ctx.fillText(p.score, x, top);
    for (let i = 0; i < MAX_TOUCHES; i++) {
      ctx.fillStyle = i < p.touches ? p.color : 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(x - 15 + i * 15, top + 64, 5, 0, 7); ctx.fill();
    }
    if (server === p && (state === 'serve' || state === 'play')) {
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = 'rgba(23,50,74,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, top + 82, 5, 0, 7); ctx.fill(); ctx.stroke();
    }
  }
  if (msgT > 0 && state !== 'menu') {
    ctx.globalAlpha = Math.min(1, msgT * 3);
    ctx.font = '800 34px system-ui, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(message, W / 2, GROUND * .36); ctx.fillStyle = '#17324a'; ctx.fillText(message, W / 2, GROUND * .36);
    ctx.globalAlpha = 1;
  }
  if (showHint && state === 'serve') {
    ctx.fillStyle = 'rgba(23,50,74,.7)'; ctx.font = '700 17px system-ui, sans-serif';
    ctx.fillText('Finger ziehen = laufen', W / 2, GROUND + 50);
    ctx.fillText('Hochwischen = springen', W / 2, GROUND + 76);
  }
}
function render(t) {
  drawBackground(t);
  drawNet();
  drawTouchMarks();
  players.forEach(p => drawFrog(p, t));
  drawBall();
  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.t * 3); ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawHUD();
}

// ---------- Layout: Hochformat füllt den ganzen Bildschirm ----------
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const aspect = Math.max(1.5, Math.min(2.3, vh / vw));
  const cssW = Math.min(vw, vh / aspect), cssH = cssW * aspect;
  stage.style.width = cssW + 'px'; stage.style.height = cssH + 'px';
  const newH = Math.round(W * aspect), shift = (newH - PAD) - GROUND;
  H = newH; GROUND = H - PAD; NETTOP = GROUND - NET_H;
  players.forEach(p => { p.y += shift; });
  ball.y += shift;
  for (const q of particles) q.y += shift;
  safeTop = $('probe').offsetHeight * W / cssW;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
let last = 0, acc = 0;
function frame(ms) {
  const now = ms / 1000;
  const dt = Math.min(.05, now - last); last = now;
  if (!paused && state !== 'menu' && state !== 'over') {
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
  }
  render(now);
  requestAnimationFrame(frame);
}

// ---------- Touch: Finger ziehen = laufen, hochwischen = springen ----------
const SWIPE_UP = 22;          // CSS-Pixel
const pointers = new Map();   // pointerId -> { p, refY, refT }
const toX = e => { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
function playerFor(x) {
  if (mode === 'demo') return null;
  return mode === '2p' ? (x < NETX ? P1 : P2) : P1;
}
function releaseAll() {
  pointers.clear();
  players.forEach(p => { p.targetX = null; if (!p.ai) p.in = { left: false, right: false, jump: false }; });
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'menu' || state === 'over' || paused) return;
  const x = toX(e), p = playerFor(x);
  if (!p) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const steering = [...pointers.values()].some(q => q.p === p && q.steer);
  if (steering) { p.jumpBuf = .2; pointers.set(e.pointerId, { p, steer: false }); return; }  // zweiter Finger = Sprung
  p.targetX = x;
  pointers.set(e.pointerId, { p, steer: true, refY: e.clientY, refT: e.timeStamp });
});
canvas.addEventListener('pointermove', e => {
  const q = pointers.get(e.pointerId);
  if (!q || !q.steer) return;
  e.preventDefault();
  q.p.targetX = toX(e);
  // Sprung: schnelle Bewegung nach oben
  if (e.clientY > q.refY || e.timeStamp - q.refT > 170) { q.refY = e.clientY; q.refT = e.timeStamp; }
  else if (q.refY - e.clientY > SWIPE_UP) { q.p.jumpBuf = .2; q.refY = e.clientY; q.refT = e.timeStamp; }
});
function pointerEnd(e) {
  const q = pointers.get(e.pointerId);
  if (!q) return;
  pointers.delete(e.pointerId);
  if (q.steer) q.p.targetX = null;
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
for (const ev of ['contextmenu', 'gesturestart', 'dblclick']) document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

// ---------- Tastatur (für den Schreibtisch) ----------
const KEYMAP = {
  KeyA: [P1, 'left'], KeyD: [P1, 'right'], KeyW: [P1, 'jump'],
  ArrowLeft: [P2, 'left'], ArrowRight: [P2, 'right'], ArrowUp: [P2, 'jump'],
};
function key(e, down) {
  const m = KEYMAP[e.code];
  if (m) {
    let [p, k] = m;
    if (mode === '1p') p = P1;
    if (!p.ai) p.in[k] = down;
    e.preventDefault();
  } else if (e.code === 'Space') {
    if (mode !== '2p' && !P1.ai) P1.in.jump = down;
    e.preventDefault();
  } else if (down && !e.repeat) {
    if (e.code === 'KeyP' || e.code === 'Escape') setPaused(!paused);
    if (e.code === 'KeyM') toggleSound();
  }
}
addEventListener('keydown', e => key(e, true));
addEventListener('keyup', e => key(e, false));
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

// ---------- Knöpfe ----------
function goFullscreen() {
  if (!matchMedia('(pointer: coarse)').matches) return;
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) Promise.resolve(req.call(el)).catch(() => {});
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
  } catch (e) {}
}
function toggleSound() { soundOn = !soundOn; $('btnSound').style.opacity = soundOn ? 1 : .4; }
const begin = m => () => { goFullscreen(); startGame(m); };
$('btn1p').onclick = begin('1p');
$('btn2p').onclick = begin('2p');
$('btnDemo').onclick = begin('demo');
$('btnAgain').onclick = () => startGame(mode);
$('btnMenu').onclick = $('btnQuit').onclick = toMenu;
$('btnResume').onclick = () => setPaused(false);
$('btnPause').onclick = () => setPaused(!paused);
$('btnSound').onclick = toggleSound;
for (const b of document.querySelectorAll('#diff button')) b.onclick = () => {
  difficulty = +b.dataset.d;
  document.querySelectorAll('#diff button').forEach(x => x.classList.toggle('sel', x === b));
};

addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));
ball.x = P1.homeX; ball.y = GROUND - 170;
layout();
requestAnimationFrame(frame);

// Für automatisierte Tests
window.__game = { step, startGame, get state() { return state; }, players, ball, setDifficulty: d => { difficulty = d; } };
})();
</script>
</body>
</html>
